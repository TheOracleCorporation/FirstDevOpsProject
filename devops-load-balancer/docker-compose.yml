services:
  server-a:
    image: nginx:latest
    container_name: server-a
    ports:
      - "8081:80"
    volumes:
      - ./html/server-a:/usr/share/nginx/html:ro
    networks:
      - devops-net

  server-b:
    image: nginx:latest
    container_name: server-b
    ports:
      - "8082:80"
    volumes:
      - ./html/server-b:/usr/share/nginx/html:ro
    networks:
      - devops-net

  load-balancer:
    image: nginx:latest
    container_name: load-balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server-a
      - server-b
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge
